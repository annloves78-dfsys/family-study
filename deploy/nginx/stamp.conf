# ============================================================
#  도장판 — nginx 설정
# ============================================================
#  학원앱(anne.ai.kr)과 아들 게임앱(mift.anne.ai.kr) 설정은
#  건드리지 않는 별도 파일입니다.
#
#  ⚠ 이 파일은 80 포트만 적어 둡니다.
#     certbot 이 인증서를 발급하면서 443 과 ssl_certificate 줄을
#     알아서 넣어 줍니다 (annest / mift 도 같은 방식입니다).
#
#  설치: deploy/scripts/03_go_live.sh 가 합니다.
# ============================================================

server {
    listen 80;
    listen [::]:80;

    #  두 주소를 다 받습니다.
    #   - stamp.anne.ai.kr  : 옮기는 동안 확인용
    #   - family.anne.ai.kr : 아이들이 홈 화면에 설치해 둔 원래 주소.
    #                         지금은 Vercel 을 가리키고, 확인이 끝나면
    #                         DNS 만 이 서버로 돌리면 바로 여기로 옵니다.
    #                         (nginx 는 미리 준비돼 있으니 서버 작업 불필요)
    server_name stamp.anne.ai.kr family.anne.ai.kr;

    # ── 정적 화면 (vite build 결과) ──────────────────────────
    root /home/stamp/www;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API → Node 서버 (3010) ───────────────────────────────
    #  annest 는 3001/3002 를 씁니다. 겹치지 않습니다.
    location /api/ {
        proxy_pass http://127.0.0.1:3010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        client_max_body_size 128k;
    }

    # ── 앱 설치 관련 파일 ────────────────────────────────────
    #  ⚠ sw.js 는 절대 오래 캐시하면 안 됩니다.
    #     파일명에 해시가 없어서, 캐시되면 앱을 고쳐도 아이들 폰에
    #     새 버전이 영영 안 내려갑니다.
    #     (location = 는 아래 정규식 규칙보다 우선합니다)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ── 캐시 ─────────────────────────────────────────────────
    #  vite 가 파일명에 해시를 붙이므로 오래 캐시해도 안전합니다.
    location ~* \.(js|css)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # ── 기본 보안 헤더 ───────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/stamp.access.log;
    error_log  /var/log/nginx/stamp.error.log;
}
